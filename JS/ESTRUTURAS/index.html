<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS - IF-ELSE</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    input {
        padding: 10px;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-left: 10px;
        border-radius: 5px;
    }

    #resultado {
        margin-top: 20px;
        font-size: 50px;
    }
    .container {
        max-width: 400px;
        margin: auto;
        text-align: center;
    }
    #resultado2 {
        margin-top: 20px;
        font-size: 30px;
    }
    .escolherCor {
        max-width: 400px;
        margin: auto;
        text-align: center;
        margin-top: 50px;
    }
    #cor {
        padding: 10px;
        font-size: 16px;
    }
    .dataNasc {
        max-width: 400px;
        margin: auto;
        text-align: center;
        margin-top: 50px;
    }
    #anoDropdown {
        padding: 10px;
        font-size: 16px;
    }
    select {
        padding: 10px 20px;
        font-size: 16px;
        margin-left: 10px;
        border-radius: 5px;
    }
    .sensor {
        max-width: 400px;
        margin: auto;
        text-align: center;
        margin-top: 50px;
    }
</style>
<body>
    <div class="container">
        <input type="text" id="nome" placeholder="Digite seu nome">
        <button onclick="validar()">Verificar</button>
        <p id="resultado"></p>
    </div>

    <div class="escolherCor">
       <select id="cor">
            <option value="" selected disabled>Selecione uma cor</option>
            <option value="red">Vermelho</option>
            <option value="green">Verde</option>
            <option value="blue">Azul</option>
            <option value="black">Preto</option>
        </select>
        <button onclick="escolherCor()">Escolher Cor</button>
        <p id="resultado2"></p>
    </div>

    <div class="dataNasc">
        <label for="dataNasc">Digite sua data de nascimento:</label>
        <select id="anoDropdown"></select>
    </div>

    <div class="sensor">
        <h3>Sensor de Temperatura</h3>
        <p id="">Status <span id="status">Normal</span></p>
        <p>Temp: <span id="temp"></span>°C</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
