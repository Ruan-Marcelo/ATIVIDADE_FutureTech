<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Catalogo de Filmes: atividade tematica com filmes cadastrados, capas, trailer do YouTube e tempo assistido."
    />
    <title>Catalogo de Filmes | Cadastro</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Navegacao principal">
        <div class="nav-links">
          <a href="./index.html" aria-current="page">Cadastro</a>
          <a href="./catalogo.html">Catalogo</a>
          <a href="https://www.imdb.com/chart/top/" target="_blank" rel="noopener noreferrer">Sugestoes</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-grid hero-grid-simple">
          <div class="hero-copy">
            <h1>Catalogo de Filmes</h1>
          </div>
        </div>
      </section>

      <section class="form-section container" aria-labelledby="titulo-cadastro">
        <div class="section-heading">
          <h2 id="titulo-cadastro">Cadastrar filme</h2>
        </div>

        <form class="movie-form" id="movieForm">
          <div class="field">
            <label for="titulo">Titulo da obra</label>
            <input id="titulo" name="titulo" type="text" placeholder="Ex: Dragon Ball Super: Super Hero" required />
          </div>

          <div class="field">
            <label for="destaque">Destaque da obra</label>
            <select id="destaque" name="destaque" required>
              <option value="">Selecione</option>
              <option value="Guerreiros Z">Guerreiros Z</option>
              <option value="Torneio">Torneio</option>
              <option value="Red Ribbon">Red Ribbon</option>
              <option value="Deuses">Deuses</option>
              <option value="Vilao classico">Vilao classico</option>
            </select>
          </div>

          <div class="field">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione</option>
              <option value="Filme">Filme</option>
              <option value="Saga">Saga</option>
              <option value="Especial">Especial</option>
              <option value="Episodio">Episodio</option>
            </select>
          </div>

          <div class="field">
            <label for="minutos">Minutos assistidos</label>
            <input id="minutos" name="minutos" type="number" min="0" step="1" placeholder="100" required />
          </div>

          <div class="field field-wide">
            <label for="capa">URL da capa</label>
            <input
              id="capa"
              name="capa"
              type="url"
              placeholder="https://exemplo.com/capa.jpg"
              required
            />
          </div>

          <div class="field">
            <label for="youtubeId">ID do YouTube</label>
            <input id="youtubeId" name="youtubeId" type="text" placeholder="Ex: FHgm89hKpXU" required />
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status" required>
              <option value="Assistido">Assistido</option>
              <option value="Assistindo">Assistindo</option>
              <option value="Na lista">Na lista</option>
            </select>
          </div>

          <div class="field field-wide">
            <label for="descricao">Descricao curta</label>
            <textarea
              id="descricao"
              name="descricao"
              rows="4"
              placeholder="Ex: Uma batalha decisiva mistura humor, energia saiyajin e ameacas capazes de mudar o destino da Terra."
              required
            ></textarea>
          </div>

          <div class="form-actions">
            <button class="button-primary" type="submit">Salvar no catalogo</button>
            <a class="button-secondary" href="./catalogo.html">Ver catalogo</a>
          </div>

          <p class="form-feedback" id="feedback" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Catalogo de Filmes | Atividade de logica, persistencia e midia</p>
      </div>
    </footer>

    <script src="./assets/js/app.js"></script>
  </body>
</html>
